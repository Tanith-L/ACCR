[project]
name = "rheumnotes-data"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0", "pydantic>=2.7", "jsonschema>=4.22", "pyyaml>=6.0", "pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["rheumnotes_data"]

[tool.setuptools.package-data]
rheumnotes_data = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
