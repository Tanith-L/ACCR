oms-11", "shape": "rect", "bounds": {"x": 0.670139, "y": 0.691589, "width": 0.292535, "height": 0.121495}}, {"id": "ankles", "label": "Ankles", "lesson_id": "psa-symptoms-12", "shape": "rect", "bounds": {"x": 0.670139, "y": 0.83528, "width": 0.292535, "height": 0.136098}}]}}, {"id": "treatment", "name": "Treatment options & flare management", "order": 4, "subtopics": [{"id": "treatment-framework", "name": "How treatment is organized", "order": 1, "lesson_ids": ["psa-treatment-01", "psa-treatment-02", "psa-treatment-03"]}]}, {"id": "education", "name": "Daily life with PsA", "order": 5, "subtopics": [{"id": "education-pillars", "name": "Four pillars framework", "order": 1, "lesson_ids": ["psa-education-01", "psa-education-02", "psa-education-03"]}]}, {"id": "contact", "name": "Talking with your care team", "order": 6, "subtopics": [{"id": "contact-symptoms", "name": "Symptoms to report", "order": 1, "lesson_ids": ["psa-contact-01", "psa-contact-02"]}]}], "lessons": [{"id": "psa-dx-01", "topic_id": "dx", "subtopic_id": "dx-caspar", "title": "How doctors assess possible PsA", "est_minutes": 2, "pages": [{"order": 1, "body": "A diagnosis starts with your story and an exam. A rheumatologist is a doctor who treats joint and immune system diseases. The doctor asks which joints hurt, when stiffness starts, and how symptoms affect daily tasks. They also ask about psoriasis and family history. There is no single test that proves someone has PsA. The whole pattern matters. Bring a short list of changes, even if they come and go. Note how long stiffness lasts after you wake up."}, {"order": 2, "body": "The exam may include joints, the back, skin, nails, and places where tendons attach to bone. Blood tests can help check for other causes of symptoms. Images, such as X-rays, ultrasound, or MRI, may help show inflammation or damage. Not everyone needs every test. A normal result on one test does not explain the whole picture. Tell the team about changes outside the joints, too.\n\nThe scanner picture shows an MRI test. Ask what a suggested test may add to your history and exam."}], "key_takeaways": ["There is no single test that proves someone has PsA.", "The whole pattern matters."], "claims": [{"id": "psa-dx-01-c1", "kind": "provenance", "references": [{"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}, {"id": "nhs-psa", "title": "NHS: Psoriatic arthritis", "url": "https://www.nhs.uk/conditions/psoriatic-arthritis/"}], "source_usage": [{"source_id": "src-psa-one-pager-intro", "pages": [1, 2], "kind": "text", "locator": "Box A: inflammatory joint/spine/enthesis entry; Box B: skin/nail signs", "contribution": "Which findings a clinician checks; psoriasis history and multi-area examination.", "limits": "The testing workflow and no-single-test statement come from NIAMS, not this poster."}, {"source_id": "src-murphys-laws-of-arthritis-preface", "pages": [1], "kind": "text", "locator": "Paragraph 11: preparation and proactive monitoring", "contribution": "Bring a concise symptom history to the visit.", "limits": "The morning-stiffness question is an editorial visit-preparation example; diagnostic shortcuts in paragraphs 16-18 are not taught."}, {"source_id": "src-supp-mri-scan", "pages": [2], "kind": "image", "locator": "Complete supplied supplementary image; https://commons.wikimedia.org/wiki/File:Blausen_0654_MRI_01.png", "contribution": "Shows what one of the imaging tests looks like.", "limits": "Illustration only; not diagnostic evidence or proof of treatment effect. Photo subjects are not identified as PsA patients or ACCR staff."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 5.438}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "supp-mri-scan", "page": 2}]}, {"id": "psa-dx-02", "topic_id": "dx", "subtopic_id": "dx-caspar", "title": "Understanding the CASPAR framework", "est_minutes": 2, "pages": [{"order": 1, "body": "CASPAR is a way to group findings for PsA. First, there must be signs of inflammation. These may be in a joint, the spine, or a tendon attachment. Other features are then considered. They include psoriasis now or in the past, or psoriasis in the family. Nail changes and swelling of a whole finger or toe are also part of the framework."}, {"order": 2, "body": "A blood test called rheumatoid factor is one part of the picture. CASPAR also looks for a specific pattern of new bone near a joint on an X-ray. A heel spur alone is not that finding. The reference uses points, but a score is not a home diagnosis. A doctor must assess the findings and check for other causes. Use the framework to follow the discussion with your team.\n\nThe diagram groups the findings discussed in this lesson. Read it as a guide to the visit, not a checklist for diagnosing yourself."}], "key_takeaways": ["First, there must be signs of inflammation.", "A heel spur alone is not that finding."], "claims": [{"id": "psa-dx-02-c1", "kind": "provenance", "references": [{"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}, {"id": "caspar-original", "title": "Taylor et al. (2006): original CASPAR classification study", "url": "https://pubmed.ncbi.nlm.nih.gov/16871531/"}], "source_usage": [{"source_id": "src-mindmap", "pages": [1, 2], "kind": "text_and_image", "locator": "Right-hand CASPAR branch: entry criterion and five feature groups; Editorial diagram based on the located source sections and current lesson; diagram spec: caspar-framework", "contribution": "Inflammation first, then psoriasis history, nail changes, whole-digit swelling, RF and new bone. Displays a plain-language teaching summary; original diagram, not a source screenshot.", "limits": "Handwritten heading says CASPER; use CASPAR. Do not turn this into a self-diagnosis score. Diagram omits scoring cutoffs, drug doses, prevalence estimates and individual predictions."}, {"source_id": "src-psa-one-pager-intro", "pages": [1, 2], "kind": "text", "locator": "Box A: CASPAR table", "contribution": "Explains current/past/family psoriasis, nails, RF and dactylitis.", "limits": "Lower table rows are obscured by Box C. Use the mindmap and original CASPAR paper for the new-bone feature."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 5.441}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-diagram-caspar-framework", "page": 2}]}, {"id": "psa-overview-01", "topic_id": "overview", "subtopic_id": "overview-basics", "title": "What PsA is", "est_minutes": 2, "pages": [{"order": 1, "body": "Psoriatic arthritis, or PsA, is a long-term condition linked to inflammation. The immune system becomes overactive. This can cause pain and swelling in joints and where tendons attach to bone. Psoriasis is a related skin condition that can cause scaly patches. Psoriasis and PsA are linked, but they are not the same condition. Many people have skin psoriasis before joint symptoms begin. Some notice joint symptoms first.\n\nA joint is a place where bones meet. Smooth cartilage covers the bone ends. A thin lining makes fluid that helps the joint move. Tendons join muscle to bone. Ligaments join bone to bone. Knowing these parts can help you describe where you hurt."}, {"order": 2, "body": "The next lesson groups PsA into six areas, called domains. These are skin, nails, joints away from the spine, the spine, swollen fingers or toes, and tendon attachment sites. You may have changes in some areas and not others. Not everyone has changes in all six areas. Skin and joint changes may follow different patterns. These areas describe the disease. They are not the six topics in this course."}], "key_takeaways": ["Psoriasis and PsA are linked, but they are not the same condition.", "Not everyone has changes in all six areas."], "claims": [{"id": "psa-overview-01-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}], "source_usage": [{"source_id": "src-psa-one-pager-intro", "pages": [1, 2], "kind": "text", "locator": "Central PsA title and Box B six core domains", "contribution": "Introduces PsA and separates the disease domains from the six course topics.", "limits": "Immune-system explanation and timing of skin/joint symptoms are supplemented by NIAMS."}, {"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1, 2], "kind": "text_and_image", "locator": "Subtitle and body-area cards", "contribution": "Introduces PsA across the body; the complete supplied poster is displayed on lesson page 1 as a general overview.", "limits": "Not everyone has every manifestation. Eye and gut conditions can occur alongside PsA; the poster is not a diagnostic tool."}, {"source_id": "src-grappa-domains-in-psa-poster", "pages": [2], "kind": "text", "locator": "All six domain headings", "contribution": "Names the six domains in plain language.", "limits": "Domain labels are not course topic labels."}, {"source_id": "src-rheumnotes-anatomy-2026", "pages": [1], "kind": "text", "locator": "PDF pp. 5?6: joint types and tissues", "contribution": "Plain-language definitions of joint tissues; no detailed anatomy image in this introductory lesson.", "limits": "General anatomy or daily-care education, not a diagnostic test or a claim of PsA treatment efficacy. Clinical review pending."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 6.01}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-symptoms-body-map", "page": 1}]}, {"id": "psa-overview-02", "topic_id": "overview", "subtopic_id": "overview-basics", "title": "PsA across the body", "est_minutes": 2, "pages": [{"order": 1, "body": "The six card labels describe different parts of PsA. Skin psoriasis means scaly skin patches. Nail psoriasis can cause pits or lifting of the nail. Peripheral arthritis affects joints away from the spine, such as those in the hands or knees. Axial disease affects the spine and may involve the joints that join the spine to the pelvis. These are called sacroiliac, or SI, joints."}, {"order": 2, "body": "Dactylitis means swelling of a whole finger or toe. Enthesitis means inflammation where a tendon or ligament joins bone. The back or bottom of the heel may be affected. These six domains can help guide treatment discussions. They do not name a drug that is right for you. Eye or bowel inflammation can also occur alongside PsA. These are separate from the six domains. Heart health, blood sugar, weight, and mood can also matter in care. The symptoms topic covers these concerns and changes over time.\n\nThe anatomy chart groups the body into nine regions. These are places in the body, not the six PsA domains. For example, the hand has bones, joints, tendons, and nerves. Pain in one area can involve more than one type of tissue."}], "key_takeaways": ["Dactylitis means swelling of a whole finger or toe.", "These six domains can help guide treatment discussions."], "claims": [{"id": "psa-overview-02-c1", "kind": "provenance", "references": [{"id": "npf-related", "title": "National Psoriasis Foundation: Related Conditions of Psoriatic Arthritis", "url": "https://www.psoriasis.org/psa-related-conditions/"}, {"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}], "source_usage": [{"source_id": "src-grappa-domains-in-psa-poster", "pages": [1, 2], "kind": "text_and_image", "locator": "Six domain cards, including axial disease, dactylitis and enthesitis", "contribution": "Defines the six disease domains; displayed on page 1.", "limits": "Technical poster wording is explained in the domains", "title": "Eyes and symptoms that need prompt care", "est_minutes": 1, "pages": [{"order": 1, "body": "The eyes card describes inflammation inside the eye. One name for this is uveitis. It can cause eye pain, redness, blurred sight, or trouble with bright light. These symptoms can have other causes, too. A body map cannot tell which cause is present.\n\nThe picture shows the uvea, a layer inside the eye. It includes the iris, the colored part at the front. Uveitis may affect other parts of the eye, too. The picture shows normal parts, so you cannot use it to judge whether an eye is inflamed."}, {"order": 2, "body": "New eye pain, marked redness, light sensitivity, or blurred sight need urgent assessment. Possible acute eye inflammation needs a same-day eye assessment. Seek emergency care for a loss of vision. Do not wait for your next routine visit or a reply in the app. An eye exam is needed to find the cause."}], "key_takeaways": ["A body map cannot tell which cause is present.", "Seek emergency care for a loss of vision."], "claims": [{"id": "psa-symptoms-02-c1", "kind": "provenance", "references": [{"id": "nhs-uveitis", "title": "NHS: Uveitis", "url": "https://www.nhs.uk/conditions/uveitis/"}, {"id": "nice-eye", "title": "NICE NG65, recommendation 1.1.12: same-day eye assessment", "url": "https://www.nice.org.uk/guidance/ng65/chapter/recommendations"}, {"id": "nei-uveitis", "title": "National Eye Institute: Uveitis — eye anatomy and symptoms", "url": "https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/uveitis"}], "source_usage": [{"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1, 2], "kind": "text", "locator": "eyes card on the clinical manifestations body map", "contribution": "Body location and symptom description for this lesson. Daily-task and reporting examples are editorial explanations.", "limits": "The image is not a diagnostic or urgency tool; use the external references for clinical assessment and eye urgency."}, {"source_id": "src-psa-one-pager-intro", "pages": [1], "kind": "text", "locator": "Box B and Box C: eyes", "contribution": "Cross-checks domain or related-condition terminology.", "limits": "No drug choices, risk percentages or self-diagnosis rules are inferred."}, {"source_id": "src-psa-as-symptoms", "pages": [1], "kind": "text", "locator": "eyes body label", "contribution": "Cross-checks the original body location; the source includes both PsA and AS.", "limits": "No drug choices, risk percentages or self-diagnosis rules are inferred."}, {"source_id": "src-supp-eye-uveitis", "pages": [1], "kind": "text_and_image", "locator": "Complete supplied supplementary image; https://commons.wikimedia.org/wiki/File:EyeDiagramUveitis_0.jpg", "contribution": "Shows the part of the eye where uveitis happens. Explains the labeled uvea and iris; the NEI reference supplements the diagram.", "limits": "Illustration only; not diagnostic evidence or proof of treatment effect. Photo subjects are not identified as PsA patients or ACCR staff."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 6.133}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "supp-eye-uveitis", "page": 1}]}, {"id": "psa-symptoms-03", "topic_id": "symptoms", "subtopic_id": "symptoms-domains", "title": "Related health and changes over time", "est_minutes": 2, "pages": [{"order": 1, "body": "The statement above the body map says PsA may lead to lasting damage. Disease activity can rise and fall. A flare is a time when symptoms return or worsen. A flare and lasting joint damage are different. A flare describes activity now; damage refers to changes that may persist. There is no fixed sequence that everyone follows. Treatment aims to control symptoms and limit harm. Tell the team about changes in pain, swelling, fatigue, or daily tasks."}, {"order": 2, "body": "A comorbidity means another health condition alongside PsA. This is not the same as joint damage. Your team may discuss heart health, blood pressure, blood sugar, cholesterol, weight, or mood. Some people also have eye or bowel inflammation. Ask which health checks fit your history. A higher risk does not mean you will get another condition. A number on a general poster does not tell you your own risk. Share concerns so the care plan can address your whole health.\n\nThe diagram groups health topics you can bring to a visit. It does not rank them or give a personal risk score."}], "key_takeaways": ["A flare and lasting joint damage are different.", "A number on a general poster does not tell you your own risk."], "claims": [{"id": "psa-symptoms-03-c1", "kind": "provenance", "references": [{"id": "npf-related", "title": "National Psoriasis Foundation: Related Conditions of Psoriatic Arthritis", "url": "https://www.psoriasis.org/psa-related-conditions/"}, {"id": "npf-flares", "title": "National Psoriasis Foundation: Care Path, Keep Thriving", "url": "https://www.psoriasis.org/care-path-thrive/"}, {"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}], "source_usage": [{"source_id": "src-poster-of-the-comorbidities-seen-in-psa", "pages": [2], "kind": "text_and_image", "locator": "Blood pressure, metabolic, heart disease, obesity and depression headings; Editorial diagram based on the located source sections and current lesson; diagram spec: whole-health", "contribution": "Names related health concerns to discuss with the care team. Displays a plain-language teaching summary; original diagram, not a source screenshot.", "limits": "Do not reproduce percentages, rankings, or imply these are inevitable. Lung, thyroid and non-IBD gut statistics await evidence review. Diagram omits scoring cutoffs, drug doses, prevalence estimates and individual predictions."}, {"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1], "kind": "text", "locator": "Subtitle: possible lasting damage", "contribution": "Introduces possible long-term harm.", "limits": "Flare definition and activity-versus-damage distinction require the separate NPF/NIAMS references."}, {"source_id": "src-psa-as-symptoms", "pages": [1], "kind": "text", "locator": "Subtitle: possible long-term damage", "contribution": "Cross-checks that the source discusses possible damage, not a fixed progression.", "limits": "Does not support a timetable, stages or an individual prediction."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 5.634}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-diagram-whole-health", "page": 2}]}, {"id": "psa-symptoms-04", "topic_id": "symptoms", "subtopic_id": "symptoms-domains", "title": "Gut and bowel changes", "est_minutes": 1, "pages": [{"order": 1, "body": "The gut card describes pain, bloating, and changes in bowel habits. Inflammatory bowel disease, or IBD, can occur alongside PsA. This is a condition that causes inflammation in the gut. A bowel change does not prove that you have IBD or that PsA is the cause.\n\nUse the picture to locate the stomach and the small and large intestine. It shows normal body parts. It cannot show what is causing a change in your bowel habits."}, {"order": 2, "body": "Tell your care team about gut symptoms that keep happening. Note what changed, when it started, and how it affects your day. Your team may ask about your medicines and decide whether you need more tests. If symptoms are severe or you feel acutely unwell, seek urgent medical help."}], "key_takeaways": ["A bowel change does not prove that you have IBD or that PsA is the cause.", "Tell your care team about gut symptoms that keep happening."], "claims": [{"id": "psa-symptoms-04-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}, {"id": "npf-related", "title": "National sA can affect a shoulder joint and nearby tissues. Pain may make it hard to reach up or put on a shirt. A sore shoulder can have more than one cause. The body map shows a place to discuss, not a diagnosis.\n\nThe shoulder is a ball in a shallow socket. A group of muscles and tendons called the rotator cuff helps hold it steady as you lift your arm. Small fluid-filled sacs help tissues glide. The picture shows normal parts, not damage from PsA."}, {"order": 2, "body": "Tell your team which shoulder hurts and when the pain began. Describe a task that has become harder, such as reaching a shelf. Mention stiffness, swelling, or a change in how far you can move. Your team can check the joint and the tissues around it."}], "key_takeaways": ["A sore shoulder can have more than one cause.", "Describe a task that has become harder, such as reaching a shelf."], "claims": [{"id": "psa-symptoms-05-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}, {"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1, 2], "kind": "text", "locator": "shoulders card on the clinical manifestations body map", "contribution": "Body location and symptom description for this lesson. Daily-task and reporting examples are editorial explanations.", "limits": "The image is not a diagnostic or urgency tool; use the external references for clinical assessment and eye urgency."}, {"source_id": "src-psa-as-symptoms", "pages": [1], "kind": "text", "locator": "shoulders body label", "contribution": "Cross-checks the original body location; the source includes both PsA and AS.", "limits": "No drug choices, risk percentages or self-diagnosis rules are inferred."}, {"source_id": "src-rheumnotes-anatomy-2026", "pages": [1], "kind": "text_and_image", "locator": "PDF p. 20: normal regional anatomy; PDF p. 20: displayed illustration; Image Credits appendix", "contribution": "Explain normal structures and help locate symptoms. Display the selected source image with attribution.", "limits": "Normal anatomy only. OA/RA/gout images, exam maneuvers and range-of-motion targets are not used as PsA self-tests."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 3.875}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-rheumnotes-shoulder", "page": 1}]}, {"id": "psa-symptoms-06", "topic_id": "symptoms", "subtopic_id": "symptoms-domains", "title": "Wrists, hands, fingers, and nails", "est_minutes": 1, "pages": [{"order": 1, "body": "This card groups several changes in the hands. A wrist or finger joint may hurt, swell, or feel stiff. Swelling of a whole finger is called dactylitis. It is different from swelling around just one joint. These changes can make tasks such as holding a cup or using buttons harder.\n\nThe wrist has small bones between the forearm and hand. Tendons help bend and straighten the fingers. Each finger has a knuckle, middle joint, and end joint. Point to the exact joint or part of the finger that has changed."}, {"order": 2, "body": "Nail psoriasis may cause small pits, yellow spots, or a nail lifting from its bed. The photo shows examples of nail changes. Nail changes and joint symptoms do not always happen together. Tell your team whether the change is in a nail, a joint, or the whole finger. Mention any trouble with daily tasks."}], "key_takeaways": ["Swelling of a whole finger is called dactylitis.", "Nail changes and joint symptoms do not always happen together."], "claims": [{"id": "psa-symptoms-06-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}, {"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1, 2], "kind": "text", "locator": "hands card on the clinical manifestations body map", "contribution": "Body location and symptom description for this lesson. Daily-task and reporting examples are editorial explanations.", "limits": "The image is not a diagnostic or urgency tool; use the external references for clinical assessment and eye urgency."}, {"source_id": "src-grappa-domains-in-psa-poster", "pages": [1], "kind": "text", "locator": "hands / corresponding core domain card", "contribution": "Defines the disease domain in plain words.", "limits": "No drug choices, risk percentages or self-diagnosis rules are inferred."}, {"source_id": "src-psa-one-pager-intro", "pages": [1], "kind": "text", "locator": "Box B and Box C: hands", "contribution": "Cross-checks domain or related-condition terminology.", "limits": "No drug choices, risk percentages or self-diagnosis rules are inferred."}, {"source_id": "src-psa-as-symptoms", "pages": [1], "kind": "text", "locator": "hands body label", "contribution": "Cross-checks the original body location; the source includes both PsA and AS.", "limits": "No drug choices, risk percentages or self-diagnosis rules are inferred."}, {"source_id": "src-nail-psoriasis-illustration", "pages": [2], "kind": "image", "locator": "PSA2 caption and nails", "contribution": "Pits, yellow spots and nail lifting.", "limits": "Supplied educational illustration; does not diagnose a patient."}, {"source_id": "src-rheumnotes-anatomy-2026", "pages": [1], "kind": "text_and_image", "locator": "PDF p. 33: normal regional anatomy; PDF p. 33: displayed illustration; Image Credits appendix", "contribution": "Explain normal structures and help locate symptoms. Display the selected source image with attribution.", "limits": "Normal anatomy only. OA/RA/gout images, exam maneuvers and range-of-motion targets are not used as PsA self-tests."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 5.62}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-nail-psoriasis", "page": 2}, {"media_id": "psa-rheumnotes-hand", "page": 1}]}, {"id": "psa-symptoms-07", "topic_id": "symptoms", "subtopic_id": "symptoms-domains", "title": "Feet, heel pain, and tendon attachments", "est_minutes": 2, "pages": [{"order": 1, "body": "Enthesitis means inflammation where a tendon or ligament joins bone. The feet card shows this type of change. The Achilles tendon joins the back of the heel. The plantar fascia attaches at the bottom of the heel. These sites can feel sore or tender. The two pictures show the difference in location.\n\nThe foot has a heel region, a middle region, and the toes and long bones at the front. A strong band under the foot helps support the arch. Use these landmarks to show whether pain is under the heel, at the back, or near the toes."}, {"order": 2, "body": "Tell your team if pain is at the back or bottom of the heel, in a toe, or elsewhere in the foot. Mention whether walking has become harder. Heel pain can have several causes. A symptom picture cannot tell you the cause on its own. Your team can examine the area and decide what to check next."}], "key_takeaways": ["Heel pain can have several causes.", "A symptom picture cannot tell you the cause on its own."], "claims": [{"id": "psa-symptoms-07-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}, {"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_ elp locate symptoms. Display the selected source image with attribution.", "limits": "Normal anatomy only. OA/RA/gout images, exam maneuvers and range-of-motion targets are not used as PsA self-tests."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 4.189}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-achilles-enthesitis", "page": 1}, {"media_id": "psa-plantar-fasciitis", "page": 1}, {"media_id": "psa-rheumnotes-foot", "page": 2}]}, {"id": "psa-symptoms-08", "topic_id": "symptoms", "subtopic_id": "symptoms-domains", "title": "Spine and SI joints", "est_minutes": 1, "pages": [{"order": 1, "body": "Axial disease means PsA affects the spine. It may also affect the sacroiliac, or SI, joints. These joints link the lower spine to the pelvis. Inflammation in these areas can cause back pain and stiffness. The spine card shows where these changes may occur.\n\nThe spine is a stack of bones called vertebrae. Discs sit between many of them. The sacrum is the bone at the base of the spine. The SI joints link it to the pelvis. The picture shows normal spine regions; it cannot show the cause of your pain."}, {"order": 2, "body": "Tell your care team where your back feels sore or stiff. Note when it happens and how it affects sleep or movement. Back pain can have many causes. This map cannot show which cause you have. A clinician uses your story, an exam, and sometimes tests to understand the pattern."}], "key_takeaways": ["Back pain can have many causes.", "These joints link the lower spine to the pelvis."], "claims": [{"id": "psa-symptoms-08-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}, {"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_us bows and nearby tendons", "est_minutes": 1, "pages": [{"order": 1, "body": "PsA can cause pain or tenderness in an elbow joint or nearby tendons. The elbow card shows these areas. Bending your arm or lifting an object may feel harder. Pain near an elbow and a skin patch on the elbow are different types of change.\n\nThe elbow acts as a hinge when you bend your arm. A nearby pivot lets you turn your palm up and down. Tendons attach near the bony bumps on each side. A small fluid-filled sac cushions the tip of the elbow."}, {"order": 2, "body": "Tell your team whether the problem is in the skin, inside the joint, or around it. You do not have to know the medical name. Describe where it hurts, when it started, and what you find hard to do. An exam can help the team work out which tissues are involved."}], "key_takeaways": ["You do not have to know the medical name.", "Pain near an elbow and a skin patch on the elbow are different types of change."], "claims": [{"id": "psa-symptoms-09-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}, {"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1, 2], "kind": "text", "locator": "elbows card on the clinical manifestations body map", "contribution": "Body location and symptom description for this lesson. Daily-task and reporting examples are editorial explanations.", "limits": "The image is not a diagnostic or urgency tool; use the external references for clinical assessment and eye urgency."}, {"source_id": "src-psa-as-symptoms", "pages": [1], "kind": "text", "locator": "elbows body label", "contribution": "Cross-checks the original body location; the source includes both PsA and AS.", oins the thigh bone and shin bone. The kneecap sits at the front. Pads of cartilage help spread the load, while strong bands hold the bones steady. A swollen knee needs an exam; a picture of normal parts cannot show why it is swollen."}, {"order": 2, "body": "Tell your care team when the knee problem began and whether one or both knees are affected. Note any swelling and the tasks that have changed. The team may examine how the knee moves and check for other causes. Seek urgent medical help if symptoms are severe or you feel acutely unwell."}], "key_takeaways": ["Knee symptoms can have more than one cause.", "A picture is only a guide to the area."], "claims": [{"id": "psa-symptoms-11-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}, {"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1, 2], "kind": "text", "locator": "knees card on the clinical manifestations body map", "contribution": "Body location and symptom description for this lesson. Daily-task and reporting examples are editorial explanations.", "limits": "The image is not a diagnostic or urgency tool; use the external references for clinical assessment and eye urgency."}, {"source_id": "src-psa-as-symptoms", "pages": [1], "kind": "text", "locator": "knees body label", "contribution": "Cross-checks the original body location; the source includes both PsA and AS.", "limits": "No drug choices, risk percentages or self-diagnosis rules are inferred."}, {"source_id": "src-rheumnotes-anatomy-2026", "pages": [1], "kind": "text_and_image", "locator": "PDF p. 49: normal regional anatomy; PDF p. 49: displayed illustration; Image Credits appendix", "contribution": "Explain normal structures and help locate symptoms. Display the selected source image with attribution.", "limits": "Normal anatomy only. OA/RA/gout images, exam maneuvers and range-of-motion targets are not used as PsA self-tests."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 5.592}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-rheumnotes-knee", "page": 1}]}, {"id": "psa-symptoms-12", "topic_id": "symptoms", "subtopic_id": "symptoms-domains", "title": "Ankles and the middle of the foot", "est_minutes": 1, "pages": [{"order": 1, "body": "The ankles card describes inflammation in the ankle and middle of the foot. Pain or swelling here can make walking harder. This is different from pain where a tendon joins the heel bone. The Feet and heel lesson explains those attachment sites.\n\nThe main ankle joint moves the foot up and down. A joint below it helps the foot tilt on uneven ground. Strong bands on both sides support the ankle. Tell the team whether pain is at the ankle, heel, or middle of the foot."}, {"order": 2, "body": "Use the map to show where the problem is. Tell your team if it is around the ankle, across the middle of the foot, or at the heel. Mention when it began and any change in walking. The location helps guide an exam. It does not show the cause by itself."}], "key_takeaways": ["Pain or swelling here can make walking harder.", "It does not show the cause by itself."], "claims": [{"id": "psa-symptoms-12-c1", "kind": "provenance", "references": [{"id": "niams-overview", "title": "NIAMS: Psoriatic Arthritis", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis"}, {"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1, 2], "kind": "text", "locator": "ankles card on the clinical manifestations body map", "contribution": "Body location and symptom description for this lesson. Daily-task and reporting examples are editorial explanations.", "limits": "The image is not a diagnostic or urgency tool; use the external references for clinical assessment and eye urgency."}, {"source_id": "src-psa-as-symptoms", "pages": [1], "kind": "text", "locator": "ankles body label", "contribution": "Cross-checks the original body location; the source includes both PsA and AS.", "limits": "No drug choices, risk percentages or self-diagnosis rules are inferred."}, {"source_id": "src-rheumnotes-anatomy-2026", "pages": [1], "kind": "text_and_image", "locator": "PDF p. 57: normal regional anatomy; PDF p. 57: displayed illustration; Image Credits appendix", "contribution": "Explain normal structures and help locate symptoms. Display the selected source image with attribution.", "limits": "Normal anatomy only. OA/RA/gout images, exam maneuvers and range-of-motion targets are not used as PsA self-tests."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 3.97}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-rheumnotes-ankle", "page": 1}]}, {"id": "psa-treatment-01", "topic_id": "treatment", "subtopic_id": "treatment-framework", "title": "How treatment goals are chosen", "est_minutes": 2, "pages": [{"order": 1, "body": "Treatment discussions start with what is active and what matters to you. The six disease domains help describe this. They include skin, nails, joints away from the spine, the spine, whole-digit swelling, and attachment sites. The care team considers these domains together."}, {"order": 2, "body": "Goals may include easing symptoms, protecting joints, and making daily tasks easier. Eye or bowel disease and other health conditions also matter. The team asks what you have tried before. They review your other medicines, side effects, and what matters to you. A treatment plan is chosen for a person, rather than from one symptom alone. A medicine that helps one domain may not cover every concern equally. Ask which parts of your disease the plan addresses and how progress will be checked.\n\nBring one task you want to do more easily, such as getting dressed or walking to a shop. This gives the team a clear goal to discuss with you."}], "key_takeaways": ["The care team considers these domains together.", "A treatment plan is chosen for a person, rather than from one symptom alone."], "claims": [{"id": "psa-treatment-01-c1", "kind": "provenance", "references": [{"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}, {"id": "grappa-2021", "title": "GRAPPA 2021 domain-based treatment recommendations (published 2022)", "url": "https://www.nature.com/articles/s41584-022-00798-0"}], "source_usage": [{"source_id": "src-psa-one-pager-intro", "pages": [1, 2], "kind": "text", "locator": "Box B domains; related conditions; comorbidities that steer the drug", "contribution": "Choice considers active domains plus eye, bowel and other health needs.", "limits": "Do not copy the abbreviated drug rules as patient instructions."}, {"source_id": "src-grappa-domains-in-psa-poster", "pages": [1], "kind": "text", "locator": "Six GRAPPA treatment domain cards", "contribution": "Names the six areas considered in goal setting; the poster is not displayed.", "limits": "Domain overview only, not a ranked treatment pathway."}, {"source_id": "src-management-guidelines-of-arthritis-and-autoimmune-diseases", "pages": [2], "kind": "text_and_image", "locator": "Paragraphs 33, 38 and 95: matching therapy, monitoring and partnership; editorial diagram: shared-treatment-goals", "contribution": "Individual response, other illnesses and follow-up shape the plan. Displays a lesson-specific editorial summary.", "limits": "This broad arthritis chapter includes RA, lupus and OA. Those disease-specific regimens are not treated as PsA guidance."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 6.486}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-diagram-shared-treatment-goals", "page": 2}]}, {"id": "psa-treatment-02", "topic_id": "treatment", "subtopic_id": "treatment-framework", "title": "Understanding treatment groups", "est_minutes": 2, "pages": [{"order": 1, "body": "Medicines have different jobs. Some help ease pain and swelling. Others aim to control the disease process. These are called DMARDs. Conventional DMARDs act broadly on the immune system. Biologic drugs target selected immune signals. Targeted synthetic drugs act on pathways inside cells. These are names for groups. They do not rank drugs from good to bad. Some drugs are pills. Others are given by a shot or through a vein. How a drug enters the body does not tell you how well it will work for you.\n\nThe diagram groups care by its role. The groups can be part of the same plan; they are not steps you move through on your own."}, {"order": 2, "body": "A drug is not right for every person or every disease domain. Some plans also include skin care, physical therapy, or help with daily tasks. The benefits, risks, and checks depend on the drug. This lesson does not give doses or tell you to start, stop, or change a medicine. Ask the prescribing team what your drug is for. Ask which checks go with it, too. Make a list of all your drugs and supplements. Ask about blood tests, infection checks, and vaccines that may go with your plan. Keep follow-up visits even when you feel better."}], "key_takeaways": ["Medicines have different jobs.", "They do not rank drugs from good to bad."], "claims": [{"id": "psa-treatment-02-c1", "kind": "provenance", "references": [{"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}, {"id": "grappa-2021", "title": "GRAPPA 2021 domain-based treatment recommendations (published 2022)", "url": "https://www.nature.com/articles/s41584-022-00798-0"}], "source_usage": [{"source_id": "src-management-guidelines-of-arthritis-and-autoimmune-diseases", "pages": [1, 2], "kind": "text_and_image", "locator": "Paragraphs 29, 38-39, 47 and 51: DMARDs, biologics, targeted oral drugs and monitoring; Editorial diagram based on the located source sections and current lesson; diagram spec: treatment-groups", "contribution": "Explains drug group roles, routes and questions about follow-up checks. Displays a plain-language teaching summary; original diagram, not a source screenshot.", "limits": "No doses, new approval claims, investigational therapies or RA/OA treatments imported. Diagram omits scoring cutoffs, drug doses, prevalence estimates and individual predictions."}, {"source_id": "src-psa-one-pager-intro", "pages": [2], "kind": "text", "locator": "Box B: why domains and related conditions change therapy", "contribution": "Explains why a drug is not right for every domain or person.", "limits": "No individual drug choice is inferred from one poster row."}, {"source_id": "src-mindmap", "pages": [1], "kind": "text", "locator": "Bottom treatment branches: DMARDs, biologic DMARDs, PDE4 and JAK pathways", "contribution": "Connects the original treatment map to the three plain-language group descriptions.", "limits": "Do not reproduce brand lists, truncated TYK2 branch or a prescribing sequence."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 4.549}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-diagram-treatment-groups", "page": 1}]}, {"id": "psa-treatment-03", "topic_id": "treatment", "subtopic_id": "treatment-framework", "title": "Tracking progress and planning for flares", "est_minutes": 2, "pages": [{"order": 1, "body": "Follow-up visits look at more than one sign of disease activity. The team may check sore or swollen joints, skin, and tendon sites. They also ask about daily tasks. Your view of pain and health matters, too. Minimal disease activity, or MDA, uses several measures together. It helps track care. It is not a stage of disease. A quiet skin patch alone does not show the whole picture."}, {"order": 2, "body": "If symptoms return or worsen, discuss a flare plan with the care team. A short record can note what changed, when it began, and how it affects daily tasks. Ask which changes need a call, which contact route to use, and what to do outside office hours. Repeated flares may mean the plan needs review. Use instructions agreed with your prescribing team for medicine questions. This general lesson does not replace your own flare plan. A useful record can include pain, sleep, energy, mood, and one task that was hard that day. Share patterns at follow-up visits. This can help the team see changes that a single visit may miss.\n\nUse the diagram to plan a short record. You do not need to give yourself a disease score. Ask the team how they want you to share changes."}], "key_takeaways": ["Follow-up visits look at more than one sign of disease activity.", "If symptoms return or worsen, discuss a flare plan with the care team."], "claims": [{"id": "psa-treatment-03-c1", "kind": "provenance", "references": [{"id": "npf-flares", "title": "National Psoriasis Foundation: Care Path, Keep Thriving", "url": "https://www.psoriasis.org/care-path-thrive/"}], "source_usage": [{"source_id": "src-mindmap", "pages": [1], "kind": "text", "locator": "Lower-middle MDA branch: joints, entheses, skin, pain, patient view and function", "contribution": "Explains multi-measure follow-up rather than judging control from skin alone.", "limits": "No self-scoring cutoffs; does not represent a disease stage."}, {"source_id": "src-murphys-laws-of-arthritis-preface", "pages": [1, 2], "kind": "text", "locator": "Paragraphs 11 and 17: contingency plans and PsA MDA", "contribution": "Preparation for flares and clinician-led disease activity review.", "limits": "Does not supply exact clinic response times or a personal flare plan."}, {"source_id": "src-the-four-pillars-of-arthritis", "pages": [2], "kind": "text_and_image", "locator": "Paragraph 85: tracking pain, energy, mood, sleep and daily tasks; Editorial diagram based on the located source sections and current lesson; diagram spec: flare-record", "contribution": "Adds a practical multi-part symptom record. Displays a plain-language teaching summary; original diagram, not a source screenshot.", "limits": "No fasting advice or guaranteed symptom improvement. Diagram omits scoring cutoffs, drug doses, prevalence estimates and individual predictions."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 6.298}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-diagram-flare-record", "page": 2}]}, {"id": "psa-education-01", "topic_id": "education", "subtopic_id": "education-pillars", "title": "The four pillars of daily care", "est_minutes": 2, "pages": [{"order": 1, "body": "Four pillars can help organize daily life with arthritis: Nourishment, Motion, Mastery, and Repose. In plain words, these mean food, movement, coping, and rest. They are a way to plan a discussion about everyday needs. They do not replace medical treatment. This framework is a guide to daily habits. It is not a test of how well your disease is controlled.\n\nThe four panels are equal parts of a daily-care plan. Start with the part that matters most to you now."}, {"order": 2, "body": "Think about which part of daily life is hardest right now. Food choices, activity, mood, and sleep may each raise different questions. A practical plan can focus on a small change that fits your needs and abilities. The care team can help tailor it. Bring up barriers such as pain, cost, fatigue, or poor sleep. Daily care works best as part of a shared plan, rather than as a test of willpower. Start with one small step you choose with your team. For example, plan a short walk that fits your joints, or set aside time to wind down before bed. Notice how the step fits into your day. You can adjust it as your needs change.\n\nYou can plan, choose what matters most, break tasks into smaller parts, and use tools or positions that ease strain. For example, split chores across the week and sit for a task when standing is hard."}], "key_takeaways": ["They do not replace medical treatment.", "The care team can help tailor it."], "claims": [{"id": "psa-education-01-c1", "kind": "provenance", "references": [{"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_id": "src-the-four-pillars-of-arthritis", "pages": [1, 2], "kind": "text_and_image", "locator": "Paragraph 8; headings at 10, 48, 65, 75; synthesis 83-85; Editorial diagram based on the located source sections and current lesson; diagram spec: four-pillars", "contribution": "Four named pillars, plain-language meanings and choosing one small step. Displays a plain-language teaching summary; original diagram, not a source screenshot.", "limits": "A daily-care framework, not validated PsA disease scoring or a replacement for treatment. Diagram omits scoring cutoffs, drug doses, prevalence estimates and individual predictions."}, {"source_id": "src-murphys-laws-of-arthritis-preface", "pages": [2], "kind": "text", "locator": "Paragraphs 11, 18 and 21: preparation, foundations and partnership", "contribution": "Simple habits and shared planning.", "limits": "Historical anecdotes and diagnostic parsimony are not taught as clinical rules."}, {"source_id": "src-rheumnotes-motion-2026", "pages": [2], "kind": "text", "locator": "PDF pp. 21–22: pacing and small goals", "contribution": "Practical pacing examples without an exercise dose.", "limits": "General anatomy or daily-care education, not a diagnostic test or a claim of PsA treatment efficacy. Clinical review pending."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 4.966}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-diagram-four-pillars", "page": 1}]}, {"id": "psa-education-02", "topic_id": "education", "subtopic_id": "education-pillars", "title": "Movement, coping, and support", "est_minutes": 3, "pages": [{"order": 1, "body": "Motion means finding ways to move that fit your joints and current health. Activity plans may include gentle movement, strength, and daily tasks. A physical therapist can help adapt a plan when pain or reduced movement gets in the way. An occupational therapist can suggest ways to protect joints during tasks. Ask your team how to balance activity and rest when symptoms change. Walking, swimming, or cycling may be options. Ask your team which activities fit you before you start. The source also describes strength work and tai chi. You do not need to try every type of exercise.\n\nTry to avoid doing all your chores on a good day and then needing days to recover. Break a large task into short parts, with rest between them. A seated option may help when standing is hard. Ask your therapist to show you a version that fits your joints."}, {"order": 2, "body": "Mastery means building ways to cope with the demands of a long-term condition. It does not mean controlling every symptom by thinking differently. Pain, fatigue, and uncertainty can affect mood and confidence. Support from trusted people, a support group, or a trained counselor may help. Tell the care team when worry or low mood affects daily life. Asking for support is part of care, not a sign of failure. A quiet pause or slow breathing may help you make space for stress. These are coping tools. They do not mean that pain is your fault or that you should skip medical care.\n\nChoose a coping step that feels right to you, such as music, writing, or a call to someone you trust. Make a short plan for a hard day while you feel calm. A counselor can also teach skills for coping with pain and worry. Ask for help if low mood affects sleep, work, or taking your medicines."}], "key_takeaways": ["Ask your team how to balance activity and rest when symptoms change.", "Asking for support is part of care, not a sign of failure."], "claims": [{"id": "psa-education-02-c1", "kind": "provenance", "references": [{"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_id": "src-the-four-pillars-of-arthritis", "pages": [1, 2], "kind": "text", "locator": "Motion paragraphs 49-50, 61-63; Mastery paragraphs 67-68 and 74", "contribution": "Adapting movement, water/cycling options, strength and coping practices.", "limits": "Many study claims concern RA/OA, not PsA; do not promise equal benefits or prescribe an exercise dose. NIAMS corroborates general PsA activity options."}, {"source_id": "src-rheumnotes-motion-2026", "pages": [1], "kind": "text", "locator": "PDF pp. 9, 17, 21–22: therapy, seated options and pacing", "contribution": "Add task pacing and adapted movement.", "limits": "No fixed exercise dose, unsupervised exercise routine or RA/OA effect size is prescribed for PsA."}, {"source_id": "src-rheumnotes-mind-2026", "pages": [2], "kind": "text_and_image", "locator": "PDF pp. 19, 21–26: thinking skills, connection and a stress plan; PDF p. 16: displayed illustration; Image Credits appendix", "contribution": "Add coping choices and reasons to seek support. Display the selected source image with attribution.", "limits": "No claim that stress causes PsA, that coping controls inflammation, or that positive thinking replaces treatment."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 5.354}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-rheumnotes-quiet-pause", "page": 2}]}, {"id": "psa-education-03", "topic_id": "education", "subtopic_id": "education-pillars", "title": "Food, sleep, and recovery", "est_minutes": 3, "pages": [{"order": 1, "body": "Nourishment focuses on food and nutrition needs. Food choices need to fit your own health and life. Food does not replace your prescribed PsA care. A dietitian can help with choices that fit your health, budget, and preferences. Ask about supplements or major diet changes before adding them to your care plan. The food chapter discusses vegetables, fruit, and sources of protein. Use these as topics to discuss with your team. It does not mean one food can switch off PsA. The lesson does not ask you to fast or follow a strict diet.\n\nMeals can include a mix of vegetables, fruit, whole grains, and protein foods such as beans, fish, or poultry. The new food tables group meats as Land, Sea, and Sky; poultry and eggs are in Sky. These labels help find foods, not rank them as treatments. Choose foods that fit your needs, allergies, budget, and culture."}, {"order": 2, "body": "Repose focuses on rest and sleep. Pain or worry may make sleep harder, and poor sleep can make the next day feel harder to manage. Bring ongoing sleep problems to the care team. Describe whether pain, waking at night, or daytime tiredness is the main concern. Plans for meals, movement, coping, and rest should fit together. The aim is a manageable routine, rather than a strict rule for every day. Try to keep a steady time for bed and waking. A quiet, dark room and a calm wind-down routine may help. Let the team know if pain keeps waking you. Ask for help with sleep rather than changing your medicine on your own.\n\nKeep a short sleep record to share at a visit. Note bedtime, wake time, waking in the night, pain, and how you feel the next day. Tell the team about loud snoring, gasping, or trouble staying awake by day. Good sleep habits may help, but ongoing sleep problems may need more care."}], "key_takeaways": ["Food does not replace your prescribed PsA care.", "Bring ongoing sleep problems to the care team."], "claims": [{"id": "psa-education-03-c1", "kind": "provenance", "references": [{"id": "nhlbi-sleep-diary", "title": "NHLBI: Sleep Diary", "url": "https://www.nhlbi.nih.gov/resources/sleep-diary"}, {"id": "niams-care", "title": "NIAMS: Diagnosis, Treatment, and Steps to Take", "url": "https://www.niams.nih.gov/health-topics/psoriatic-arthritis/diagnosis-treatment-and-steps-to-take"}], "source_usage": [{"source_id": "src-the-four-pillars-of-arthritis", "pages": [1, 2], "kind": "text", "locator": "Nourishment paragraphs 10-38; Repose paragraphs 76-80; practical steps 85", "contribution": "Food discussions, steady sleep timing and a calm bedtime routine.", "limits": "No fasting, supplement doses, food-cure claims or extrapolated RA/OA treatment effects."}, {"source_id": "src-rheumnotes-nutrition-2026", "pages": [1], "kind": "text", "locator": "PDF pp. 4, 10, 17-24: food groups and Land, Sea and Sky", "contribution": "Use the November 17 revision for food examples and protein table labels. The displayed apple is now sourced directly from the original photograph, not extracted from this PDF.", "limits": "RA diet trials, OA weight-loss effects, gout restrictions, nutrient doses and unverified guideline targets are not presented as PsA advice."}, {"source_id": "src-rheumnotes-sleep-2026", "pages": [2], "kind": "text_and_image", "locator": "PDF pp. 19–21, 25–26, 29: sleep habits, help and diary; PDF p. 19: displayed illustration; Image Credits appendix", "contribution": "Add a simple sleep diary and concerns to report. Display the selected source image with attribution.", "limits": "No self-diagnosis, sleep restriction program, sleep medicine advice or rigid sleep target."}, {"source_id": "src-red-apple-high-resolution", "pages": [1], "kind": "image", "locator": "Complete high-resolution Red Apple photograph; Wikimedia Commons file page", "contribution": "A clear example of fruit in a varied eating pattern; replaces the 241 x 180 PDF thumbnail.", "limits": "Illustrative food photo only; no claim that an apple treats PsA."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 4.643}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-rheumnotes-fruit", "page": 1}, {"media_id": "psa-rheumnotes-sleep-routine", "page": 2}]}, {"id": "psa-contact-01", "topic_id": "contact", "subtopic_id": "contact-symptoms", "title": "Sharing changes with your care team", "est_minutes": 2, "pages": [{"order": 1, "body": "Tell the care team about symptoms that are new, keep returning, or are getting worse. A body map can help you name the area: skin, nails, hands, wrists, shoulders, elbows, back, hips, knees, ankles, or feet. Mention fatigue and changes in walking, sleep, work, or self-care. A useful message says where the problem is, when it began, and what has changed. You can say, for example, that new knee pain makes stairs harder.\n\nBefore the visit, write your main question and the change that worries you most. Bring your notes so the team can help you decide the next step."}, {"order": 2, "body": "A body map cannot tell you how urgent a symptom is. The next lesson explains eye and gut changes to report. Medicine concerns and repeated flares are also reasons to contact the prescribing team. Ask your clinic for its phone number and office hours. Ask about expected response times and how to get help when it is closed. Keep your own care plan available. For urgent symptoms, use urgent medical services rather than waiting for a routine app message.\n\nA sleep record can make the visit more useful. Bring notes on when you sleep, what wakes you, and daytime tiredness. List any recent medicine changes so the team can look for patterns."}], "key_takeaways": ["A useful message says where the problem is, when it began, and what has changed.", "A body map cannot tell you how urgent a symptom is."], "claims": [{"id": "psa-contact-01-c1", "kind": "provenance", "references": [{"id": "nhs-psa", "title": "NHS: Psoriatic arthritis", "url": "https://www.nhs.uk/conditions/psoriatic-arthritis/"}, {"id": "npf-flares", "title": "National Psoriasis Foundation: Care Path, Keep Thriving", "url": "https://www.psoriasis.org/care-path-thrive/"}, {"id": "nhlbi-sleep-diary", "title": "NHLBI: Sleep Diary", "url": "https://www.nhlbi.nih.gov/resources/sleep-diary"}], "source_usage": [{"source_id": "src-psa-as-symptoms", "pages": [1, 2], "kind": "text", "locator": "Body labels and footer: talk to your healthcare provider if you notice symptoms", "contribution": "Body-map labels as a reference for describing symptom location and reporting changes; the poster is not displayed.", "limits": "Explicitly label that the poster covers both PsA and AS; not an urgency scale."}, {"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1], "kind": "text", "locator": "All body-area cards", "contribution": "Alternative readable body-area labels for a symptom message.", "limits": "Specific message examples are editorial teaching aids."}, {"source_id": "src-murphys-laws-of-arthritis-preface", "pages": [2], "kind": "text", "locator": "Paragraph 11: monitoring and contingency plans", "contribution": "Ask for contact routes and an out-of-hours plan.", "limits": "Clinic phone numbers, hours and response times must come from the patient's clinic."}, {"source_id": "src-rheumnotes-sleep-2026", "pages": [2], "kind": "text", "locator": "PDF pp. 25–26, 29: sleep diary and medicine notes", "contribution": "Prepare observations for a visit without changing medicine.", "limits": "General anatomy or daily-care education, not a diagnostic test or a claim of PsA treatment efficacy. Clinical review pending."}, {"source_id": "src-supp-doctor-patient", "pages": [1], "kind": "image", "locator": "Complete supplied supplementary image; https://commons.wikimedia.org/wiki/File:Doctor_talking_with_a_patient.jpg", "contribution": "Friendly picture for lessons about talking with the care team.", "limits": "Illustration only; not diagnostic evidence or proof of treatment effect. Photo subjects are not identified as PsA patients or ACCR staff."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 6.057}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "supp-doctor-patient", "page": 1}]}, {"id": "psa-contact-02", "topic_id": "contact", "subtopic_id": "contact-symptoms", "title": "Eye and gut changes to report", "est_minutes": 2, "pages": [{"order": 1, "body": "Eye symptoms can need prompt attention. New eye pain, marked redness, light sensitivity, or blurred sight need urgent assessment. Guidance for possible acute eye inflammation calls for a same-day eye assessment. Seek emergency care for a loss of vision. These symptoms have several possible causes. An examination is needed to find the cause; the app cannot diagnose uveitis from symptoms."}, {"order": 2, "body": "Tell the care team about ongoing gut pain, bloating, or changes in bowel habits. Inflammatory bowel disease can occur alongside PsA, but a bowel change does not prove that it is the cause. Describe what changed and when. Your team can decide whether another assessment is needed. If symptoms are severe or you feel acutely unwell, seek urgent medical help. Do not wait for a routine visit to discuss an urgent eye problem.\n\nThe reporting guide helps you prepare a clear message. It cannot tell you the cause of a symptom. Use the care guidance above and the instructions from your own team."}], "key_takeaways": ["New eye pain, marked redness, light sensitivity, or blurred sight need urgent assessment.", "Seek emergency care for a loss of vision."], "claims": [{"id": "psa-contact-02-c1", "kind": "provenance", "references": [{"id": "nhs-uveitis", "title": "NHS: Uveitis", "url": "https://www.nhs.uk/conditions/uveitis/"}, {"id": "nice-eye", "title": "NICE NG65, recommendation 1.1.12: same-day eye assessment", "url": "https://www.nice.org.uk/guidance/ng65/chapter/recommendations"}], "source_usage": [{"source_id": "src-psa-one-pager-intro", "pages": [1, 2], "kind": "text", "locator": "Box B related conditions; Box C eyes and gut", "contribution": "Identifies eye and bowel concerns alongside PsA.", "limits": "Same-day assessment and emergency advice come from NHS/NICE, not the source poster."}, {"source_id": "src-clinical-manifestations-of-psa-poster", "pages": [1, 2], "kind": "text_and_image", "locator": "Eyes and gut cards; editorial diagram: eye-gut-reporting", "contribution": "Plain-language eye and bowel symptoms to describe. Displays a lesson-specific editorial summary.", "limits": "Symptoms have multiple causes; poster cannot diagnose uveitis or IBD. Urgency wording in the editorial diagram follows the lesson NHS/NICE references, not the poster."}]}], "checks": {"schema_valid": true, "coverage": null, "safety_flags": [], "fk_grade": 7.78}, "generated_by": "llm", "status": "checked", "images": [{"media_id": "psa-diagram-eye-gut-reporting", "page": 1}]}], "quizzes": [], "media": [{"id": "psa-overview-grappa-domains", "file": "media/overview-grappa-domains.jpg", "alt_text": "Six areas of PsA: skin, nails, joints, back, swollen fingers or toes, and tendon sites.", "credit": "Source: supplied RHEUMNOTES poster.", "source_id": "src-grappa-domains-in-psa-poster"}, {"id": "psa-symptoms-body-map", "file": "media/symptoms-body-map.jpg", "alt_text": "Body areas where symptoms may appear.", "credit": "Source: supplied RHEUMNOTES poster.", "source_id": "src-clinical-manifestations-of-psa-poster"}, {"id": "psa-skin-psoriasis", "file": "media/skin-psoriasis.jpg", "alt_text": "Raised patches with scales on an elbow.", "credit": "Supplied educational illustration.", "source_id": "src-skin-psoriasis-illustration"}, {"i /). Source: https://commons.wikimedia.org/wiki/File:917_Knee_Joint.jpg. Extracted from supplied RheumNotes PDF p. 49; resized and JPEG-compressed, no new crop or labels. Attribution transcribed from the supplied image appendix.", "source_id": "src-rheumnotes-anatomy-2026"}, {"id": "psa-rheumnotes-ankle", "file": "media/rheumnotes-ankle.jpg", "alt_text": "Inner and outer views of normal ankle bones and supporting bands.", "credit": "OpenStax; CC BY 3.0 (https://creativecommons.org/licenses/by/3.0/). Source: https://commons.wikimedia.org/wiki/File:919_Ankle_Feet_Joints.jpg. Extracted from supplied RheumNotes PDF p. 57; resized and JPEG-compressed, no new crop or labels. Attribution transcribed from the supplied image appendix.", "source_id": "src-rheumnotes-anatomy-2026"}, {"id": "psa-rheumnotes-quiet-pause", "file": "media/rheumnotes-quiet-pause.jpg", "alt_text": "A quiet moment outdoors. Reflection or prayer can be a personal coping choice.", "credit": "Ben White; CC0 (https://creativecommons.org/publicdomain/zero/1.0/). Source: https://commons.wikimedia.org/wiki/File:Praying_woman_in_a_park_(Unsplash).jpg. Extracted from supplied RheumNotes PDF p. 16; resized and JPEG-compressed, no new crop or labels. Attribution transcribed from the supplied image appendix.", "source_id": "src-rheumnotes-mind-2026"}, {"id": "psa-rheumnotes-fruit", "file": "media/rheumnotes-fruit-hd.jpg", "alt_text": "Include fruit as part of varied meals, alongside vegetables, whole grains, and protein foods. Choose options that fit your needs and budget.", "credit": "Abhijit Tembhekar; CC BY 2.0 (https://creativecommons.org/licenses/by/2.0/). Source: https://commons.wikimedia.org/wiki/File:Red_Apple.jpg. Downloaded original 2418 x 2192 photograph; resized to 1400 x 1269 and JPEG-compressed. No crop or added labels.", "source_id": "src-red-apple-high-resolution"}, {"id": "psa-rheumnotes-sleep-routine", "file": "media/rheumnotes-sleep-routine.jpg", "alt_text": "Try to go to bed and wake up at about the same time each day. If pain keeps waking you, tell your care team.", "credit": "Ales Krivec; CC0 (https://creativecommons.org/publicdomain/zero/1.0/). Source: https://commons.wikimedia.org/wiki/File:Roman_numerals_on_alarm_clock_(Unsplash).jpg. Extracted from supplied RheumNotes PDF p. 19; resized and JPEG-compressed, no new crop or labels. Attribution transcribed from the supplied image appendix.", "source_id": "src-rheumnotes-sleep-2026"}, {"id": "supp-doctor-patient", "file": "media/doctor-patient.jpg", "source_id": "src-supp-doctor-patient", "alt_text": "A clinician and a patient discuss care. Use a visit to share symptoms, priorities, and questions. Illustrative photo; this is not an ACCR clinic or a confirmed PsA visit.", "credit": "National Cancer Institute, National Institutes of Health. Public domain, via Wikimedia Commons. Resized. Source: https://commons.wikimedia.org/wiki/File:Doctor_talking_with_a_patient.jpg. Attribution from the existing supplementary-media manifest; copied without further changes."}, {"id": "supp-mri-scan", "file": "media/mri-scan.jpg", "source_id": "src-supp-mri-scan", "alt_text": "An MRI scanner, one of the tests a clinician may use. Not everyone needs an MRI, and an image alone does not diagnose PsA.", "credit": "Blausen Medical Communications, Inc. CC BY 3.0, via Wikimedia Commons. Resized. Source: https://commons.wikimedia.org/wiki/File:Blausen_0654_MRI_01.png. License: https://creativecommons.org/licenses/by/3.0. Attribution from the existing supplementary-media manifest; copied without further changes."}, {"id": "supp-eye-uveitis", "file": "media/eye-uveitis.jpg", "source_id": "src-supp-eye-uveitis", "alt_text": "The eye seen from the side. The uvea includes the iris, ciliary body, and choroid. This anatomy diagram cannot show whether your eye is inflamed.", "credit": "Courtesy: National Eye Institute, National Institutes of Health (NEI/NIH). Public domain, via Wikimedia Commons. Resized. Source: https://commons.wikimedia.org/wiki/File:EyeDiagramUveitis_0.jpg. Attribution from the existing supplementary-media manifest; copied without further changes."}, {"id": "supp-digestive-system", "file": "media/digestive-system.jpg", "source_id": "src-supp-digestive-system", "alt_text": "The digestive tract includes the stomach, small intestine, and large intestine. This is a normal anatomy diagram, not an image of bowel disease.", "credit": "Blausen.com staff (2014). \"Medical gallery of Blausen Medical 2014\". WikiJournal of Medicine 1(2). CC BY 3.0, via Wikimedia Commons. Resized. Source: https://commons.wikimedia.org/wiki/File:Blausen_0316_DigestiveSystem.png. License: https://creativecommons.org/licenses/by/3.0. Attribution from the existing supplementary-media manifest; copied without further changes."}, {"id": "psa-diagram-caspar-framework", "file": "media/caspar-framework.jpg", "source_id": "src-mindmap", "alt_text": "CASPAR overview: inflammation first, then psoriasis history, nail and digit changes, and test findings. A doctor interprets the findings; this is not a scoring tool.", "credit": "Original editorial diagram summarizing the lesson and its cited source material; not a reproduced source figure. Editable SVG: assisted-input/diagrams/caspar-framework.svg. Clinical review pending."}, {"id": "psa-diagram-whole-health", "file": "media/whole-health.jpg", "source_id": "src-poster-of-the-comorbidities-seen-in-psa", "alt_text": "Related health topics: heart health and blood pressure, blood sugar and weight, and mood. Discuss checks that fit your own history. No risk percentages or ranking are shown.", "credit": "Original editorial diagram summarizing the lesson and its cited source material; not a reproduced source figure. Editable SVG: assisted-input/diagrams/whole-health.svg. Clinical review pending."}, {"id": "psa-diagram-treatment-groups", "file": "media/treatment-groups.jpg", "source_id": "src-management-guidelines-of-arthritis-and-autoimmune-diseases", "alt_text": "Treatment roles include symptom relief, disease control with DMARD groups, and support such as skin care and physical therapy. These are not ranked treatment steps.", "credit": "Original editorial diagram summarizing the lesson and its cited source material; not a reproduced source figure. Editable SVG: assisted-input/diagrams/treatment-groups.svg. Clinical review pending."}, {"id": "psa-diagram-flare-record", "file": "media/flare-record.jpg", "source_id": "src-the-four-pillars-of-arthritis", "alt_text": "A symptom record includes what changed and when, sleep and energy, mood and daily tasks. Discuss contact routes and a personal flare plan with the care team.", "credit": "Original editorial diagram summarizing the lesson and its cited source material; not a reproduced source figure. Editable SVG: assisted-input/diagrams/flare-record.svg. Clinical review pending."}, {"id": "psa-diagram-four-pillars", "file": "media/four-pillars.jpg", "source_id": "src-the-four-pillars-of-arthritis", "alt_text": "Four equal pillars support daily care: food, movement, coping, and rest. Choose a manageable step with your team; daily habits do not replace medical treatment.", "credit": "Original editorial diagram summarizing the lesson and its cited source material; not a reproduced source figure. Editable SVG: assisted-input/diagrams/four-pillars.svg. Clinical review pending."}, {"id": "psa-diagram-shared-treatment-goals", "file": "media/shared-treatment-goals.jpg", "source_id": "src-management-guidelines-of-arthritis-and-autoimmune-diseases", "alt_text": "Shared treatment goals: describe what matters to you, review symptoms and other health needs, and agree how to check benefits, side effects and progress.", "credit": "Original editorial diagram summarizing the lesson and its cited sources, not a source screenshot. Clinical review pending."}, {"id": "psa-diagram-eye-gut-reporting", "file": "media/eye-gut-reporting.jpg", "source_id": "src-clinical-manifestations-of-psa-poster", "alt_text": "New eye pain, marked redness, light sensitivity or blurred sight need urgent assessment; possible acute eye inflammation needs same-day eye assessment. Loss of vision needs emergency care. Report ongoing gut changes and seek urgent help if severely unwell.", "credit": "Original editorial diagram summarizing the lesson and its cited sources, not a source screenshot. Clinical review pending."}], "editorial_sources": {"psa-dx-01": [{"source_id": "src-psa-one-pager-intro", "pages": "1, 2", "kind": "text", "locator": "Box A: inflammatory joint/spine/enthesis entry; Box B: skin/nail signs", "contribution": "Which findings a clinician checks; psoriasis history and multi-area examination.", "limits": "The testing workflow and no-single-test statement come from NIAMS, not this poster.", "title": "PsA One-Pager Intro", "href": "../originals/PsA%20One-Pager%20Intro.jpeg", "lesson_href": "../../../originals/PsA%20One-Pager%20Intro.jpeg"}, {"source_id": "src-murphys-laws-of-arthritis-preface", "pages": "1", "kind": "text", "locator": "Paragraph 11: preparation and proactive monitoring", "contribution": "Bring a concise symptom history to the visit.", "limits": "The morning-stiffness question is an editorial visit-preparation example; diagnostic shortcuts in paragraphs 16-18 are not taught.", "title": "Murphy’s Laws of Arthritis Preface", "href": "../originals/MURPHY%E2%80%99S%20LAWS%20OF%20ARTHRITIS%20%20PREFACE.docx", "lesson_href": "../../../originals/MURPHY%E2%80%99S%20LAWS%20OF%20ARTHRITIS%20%20PREFACE.docx"}, {"source_id": "src-supp-mri-scan", "pages": "2", "kind": "image", "locator": "Complete supplied supplementary image; https://commons.wikimedia.org/wiki/File:Blausen_0654_MRI_01.png", "contribution": "Shows what one of the imaging tests looks like.", "limits": "Illustration only; not diagnostic evidence or proof of treatment effect. Photo subjects are not identified as PsA patients or ACCR staff.", "title": "Picture of a person lying on the table of an MRI scanner.", "href": "
