<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rheumy</title>
<style>
  :root {
    --navy: #0033A0;
    --green: #00A651;
    --ink: #16324f;
    --paper: #f7f4ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #ffffff 0%, var(--paper) 55%, #e7eef8 100%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: min(420px, 100%);
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(0, 51, 160, 0.16);
    overflow: hidden;
    border: 1px solid rgba(0, 51, 160, 0.08);
  }
  .hero {
    background: #fff;
    padding: 18px 18px 0;
    text-align: center;
  }
  .hero img {
    width: 100%;
    height: auto;
    display: block;
  }
  .panel {
    padding: 8px 22px 22px;
  }
  .bubble {
    background: #f3f7fb;
    border-left: 4px solid var(--green);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.45;
    margin: 8px 0 16px;
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  button {
    appearance: none;
    border: 0;
    background: var(--navy);
    color: white;
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 650;
    cursor: pointer;
  }
  button.secondary {
    background: #e8f6ee;
    color: #0b6b3a;
  }
  audio { width: 100%; margin-top: 14px; }
  .note {
    margin-top: 10px;
    font-size: 12px;
    color: #6b7c90;
  }
</style>
</head>

  <script>
    const audio = document.getElementById("voice");
    const line = document.getElementById("line");
    const original = line.textContent;
    audio.autoplay = true;
    audio.preload = "auto";
    audio.setAttribute("playsinline", "");

    let started = false;
    let unlockBound = false;

    function markPlaying() {
      started = true;
      line.textContent = original;
      unbindUnlock();
    }

    function bindUnlock() {
      if (unlockBound) return;
      unlockBound = true;
      line.textContent = "Tap anywhere to hear Rheumy. This browser blocks sound until the first tap.";
      ["pointerdown", "keydown", "touchstart", "click"].forEach((eventName) => {
        document.addEventListener(eventName, unlock, true);
      });
    }

    function unbindUnlock() {
      ["pointerdown", "keydown", "touchstart", "click"].forEach((eventName) => {
        document.removeEventListener(eventName, unlock, true);
      });
      unlockBound = false;
    }

    function unlock() {
      startAudio(true);
    }

    function startAudio(fromGesture) {
      if (started && !audio.paused) return;
      audio.muted = false;
      audio.volume = 1;
      if (fromGesture) audio.currentTime = 0;
      const attempt = audio.play();
      if (attempt && attempt.then) {
        attempt.then(markPlaying).catch((err) => {
          if (!fromGesture && err && err.name === "NotAllowedError") bindUnlock();
        });
      } else {
        markPlaying();
      }
    }

    audio.addEventListener("playing", markPlaying);
    window.addEventListener("load", () => startAudio(false));
    document.addEventListener("DOMContentLoaded", () => startAudio(false));
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") startAudio(false);
    });
    document.getElementById("play").addEventListener("click", () => startAudio(true));
    document.getElementById("stop").addEventListener("click", () => {
      audio.pause();
      audio.currentTime = 0;
      started = false;
    });
  </script>
