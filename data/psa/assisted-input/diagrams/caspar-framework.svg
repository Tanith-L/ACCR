<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840">
<title>Understanding CASPAR</title><desc>CASPAR overview: inflammation first, then psoriasis history, nail and digit changes, and test findings. A doctor interprets the findings; this is not a scoring tool.</desc>
<rect width="1100" height="840" fill="#f4f8fa"/>
<rect x="0" y="0" width="1100" height="12" rx="0" fill="#087f83"/>
<text x="50" y="42" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#17364a">Understanding CASPAR</text>
<text x="50" y="108" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#526777">A framework for discussing findings with your doctor</text>
<rect x="50" y="180" width="1000" height="145" rx="18" fill="#ffffff"/>
<rect x="50" y="180" width="10" height="145" rx="4" fill="#087f83"/>
<text x="85" y="202" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17364a">Start with inflammation</text>
<text x="85" y="263" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#17364a">In a joint, the spine, or a tendon attachment</text>
<rect x="50" y="360" width="1000" height="145" rx="18" fill="#ffffff"/>
<rect x="50" y="360" width="10" height="145" rx="4" fill="#087f83"/>
<text x="85" y="382" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17364a">Look at the pattern</text>
<text x="85" y="443" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#17364a">Psoriasis history • Nail changes • A swollen whole finger or toe</text>
<rect x="50" y="540" width="1000" height="145" rx="18" fill="#ffffff"/>
<rect x="50" y="540" width="10" height="145" rx="4" fill="#087f83"/>
<text x="85" y="562" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17364a">Consider test findings</text>
<text x="85" y="623" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#17364a">Rheumatoid factor blood test • A specific new-bone pattern on X-ray</text>
<text x="50" y="764" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#315669">A doctor interprets the findings. This is not a home scoring tool.</text>
</svg>
