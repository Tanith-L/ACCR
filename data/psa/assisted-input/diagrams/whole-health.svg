<rect x="0" y="0" width="1100" height="12" rx="0" fill="#087f83"/>
<text x="50" y="42" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#17364a">Care for your whole health</text>
<text x="50" y="108" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#526777">Topics to discuss alongside your joints and skin</text>
<rect x="50" y="180" width="1000" height="145" rx="18" fill="#ffffff"/>
<rect x="50" y="180" width="10" height="145" rx="4" fill="#087f83"/>
<text x="85" y="202" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17364a">Heart and blood vessels</text>
<text x="85" y="263" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#17364a">Blood pressure • Cholesterol • Heart health</text>
<rect x="50" y="360" width="1000" height="145" rx="18" fill="#ffffff"/>
<rect x="50" y="360" width="10" height="145" rx="4" fill="#087f83"/>
<text x="85" y="382" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17364a">Metabolic health</text>
<text x="85" y="443" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#17364a">Blood sugar • Weight</text>
<rect x="50" y="540" width="1000" height="145" rx="18" fill="#ffffff"/>
<rect x="50" y="540" width="10" height="145" rx="4" fill="#087f83"/>
<text x="85" y="562" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17364a">Emotional health</text>
<text x="85" y="623" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#17364a">Mood • Support • Daily life</text>
<text x="50" y="764" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#315669">Ask which checks fit you. A higher risk is not a prediction.</text>
